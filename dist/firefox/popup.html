<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Turbo Watch Controls</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="panel" aria-live="polite">
      <h1 class="title">Turbo Watch</h1>

      <section class="control-group" aria-labelledby="speedLabel">
        <div class="label-row">
          <label id="speedLabel" for="speedSlider">Playback speed</label>
          <output id="speedValue" for="speedSlider">1.0x</output>
        </div>
        <input
          id="speedSlider"
          type="range"
          min="0.1"
          max="10"
          step="0.1"
          value="1"
          aria-describedby="speedHelp"
        />
        <p id="speedHelp" class="help">Range: 0.1x to 10.0x</p>
      </section>

      <section class="control-group" aria-labelledby="volumeLabel">
        <div class="label-row">
          <label id="volumeLabel" for="volumeSlider">Volume boost</label>
          <output id="volumeValue" for="volumeSlider">100%</output>
        </div>
        <input
          id="volumeSlider"
          type="range"
          min="100"
          max="600"
          step="10"
          value="100"
          aria-describedby="volumeHelp"
        />
        <p id="volumeHelp" class="help">Range: 100% to 600%</p>
      </section>

      <div class="actions">
        <button id="resetButton" type="button">Reset tab to defaults</button>
      </div>

      <p id="statusText" class="status">Checking active tab…</p>
    </main>

    <script src="api.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
